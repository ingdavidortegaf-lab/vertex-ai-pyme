# Integración continua: en cada push y pull request a main revisa el código
# (flutter analyze) y corre las pruebas (flutter test).
# No usa ninguna clave: las pruebas corren contra SQLite en memoria y un
# servidor falso.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Análisis y pruebas (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      # Las pruebas de la base local usan SQLite por FFI.
      - name: SQLite para las pruebas
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Dependencias
        run: flutter pub get

      # Falla con errores o advertencias. Los avisos «info» (APIs marcadas
      # como obsoletas por el SDK) no detienen el flujo.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

  aislamiento:
    name: Aislamiento entre empresas (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Supabase en Docker y aplica TODAS las migraciones de
      # supabase/migrations/ sobre una base vacía. No toca el proyecto real.
      - name: Supabase local con las migraciones
        run: supabase start

      - name: La empresa A no puede leer ni escribir en la B
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/aislamiento_empresas.sql

      - name: Roles, invitaciones y permisos por rol
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/roles_y_permisos.sql

      - name: Caja (anulaciones, descuentos y turnos)
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/caja.sql

      - name: Apagar Supabase
        if: always()
        run: supabase stop --no-backup
